[phases.setup]
nixPkgs = ["python311"]
aptPkgs = [
  "libglib2.0-0",
  "libcairo2",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libpangoft2-1.0-0",
  "libgdk-pixbuf-2.0-0",
  "libffi-dev",
  "libharfbuzz0b",
  "libfontconfig1",
  "shared-mime-info",
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
