# ============================================================================
# Retina Analyst Rubric Template
# ============================================================================
#
# Fill in scores for each sub-dimension per site. Each lens totals 20 points.
# Leave a lens section commented out or remove it entirely to skip.
#
# Usage:
#   retina https://primary.com -c https://comp1.com -r rubric.yaml -o report.json
#
# ============================================================================

sites:

  # ---- Primary Site ----
  - url: "https://example.com"
    analyst: "Your Name"

    # BRAND & MESSAGING (20 points total)
    brand_messaging:
      scores:
        brand_visual_language: 0          # /5 - Logo, colors, typography consistent across pages
        brand_voice_messaging: 0          # /5 - Professional, audience-appropriate tone of voice
        value_proposition: 0              # /5 - Clear, compelling, differentiated value prop
        brand_differentiation: 0          # /5 - Stands out from competitors visually and verbally
      observations: |
        Notes on brand presence, messaging clarity, tone of voice...
      screenshots:
        # - screenshots/example_brand_hero.png

    # EXPERIENCE & DESIGN (20 points total)
    experience_design:
      scores:
        interface_design: 0               # /5 - Aesthetic quality, whitespace, visual hierarchy
        content_taxonomy: 0               # /5 - Content organized with clear categories and hierarchy
        navigation_architecture: 0        # /5 - Logical nav, findability, menu structure
        responsiveness: 0                 # /5 - Mobile/tablet/desktop consistency
      observations: |
        Notes on design quality, UX patterns, responsive behavior...
      screenshots:
        # - screenshots/example_mobile_view.png

    # CONVERSION & STRATEGY (20 points total)
    conversion_strategy:
      scores:
        call_to_action_logic: 0           # /5 - Visible, compelling, clear action CTAs
        lead_capture_form_design: 0       # /5 - Form length, field labels, progressive disclosure
        trust_signals: 0                  # /5 - Testimonials, logos, reviews, badges
        funnel_design: 0                  # /5 - Logical progression, minimal friction
      observations: |
        Notes on conversion paths, CTA placement, trust elements...
      screenshots:
        # - screenshots/example_cta_section.png

