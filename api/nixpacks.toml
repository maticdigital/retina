[phases.setup]
nixPkgs = [
  "python311",
  "glib",
  "cairo",
  "pango",
  "gdk-pixbuf",
  "libffi",
  "gobject-introspection",
  "shared-mime-info",
  "fontconfig",
  "freetype",
  "harfbuzz",
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "export LD_LIBRARY_PATH=$(echo /nix/store/*/lib | tr ' ' ':'):$LD_LIBRARY_PATH && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
